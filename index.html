<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Una pissarra en blanc per dibuixar movent el cursor."
    />
    <title>Pissarra compartida</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="entry-screen" id="entry-screen" aria-labelledby="title">
        <form class="entry-card" id="name-form">
          <h1 id="title">Pissarra</h1>
          <p>Escriu el teu nom per començar.</p>
          <label for="user-name">El teu nom</label>
          <input
            id="user-name"
            name="name"
            type="text"
            maxlength="32"
            autocomplete="name"
            placeholder="Com et dius?"
            required
          />
          <button type="submit">Entrar</button>
        </form>
      </section>

      <section class="board" id="board" aria-label="Pissarra per dibuixar" hidden>
        <canvas id="drawing-canvas"></canvas>
        <span class="cursor-indicator" id="cursor-indicator" aria-hidden="true" hidden>
          <span class="cursor-dot"></span>
          <span class="cursor-name" id="cursor-name"></span>
        </span>
      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
