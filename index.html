<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Una pissarra en blanc per dibuixar movent el cursor."
    />
    <title>Pissarra compartida</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f5f9;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      .entry-screen {
        display: grid;
        min-height: 100vh;
        padding: 24px;
        place-items: center;
      }

      .entry-card {
        width: min(100%, 420px);
        padding: 40px;
        border: 1px solid #e5e9f1;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 60px rgb(31 43 67 / 9%);
      }

      .entry-card h1 {
        margin: 0 0 10px;
        font-size: clamp(1.6rem, 5vw, 2rem);
        letter-spacing: -0.04em;
      }

      .entry-card p {
        margin: 0 0 28px;
        color: #647087;
        line-height: 1.55;
      }

      .entry-card label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        font-weight: 650;
      }

      .entry-card input {
        width: 100%;
        min-height: 48px;
        padding: 0 14px;
        border: 1px solid #cbd3e0;
        border-radius: 10px;
        color: inherit;
        font: inherit;
      }

      .entry-card input:focus {
        border-color: #536dfe;
        outline: 3px solid rgb(83 109 254 / 18%);
      }

      .entry-card button {
        width: 100%;
        min-height: 48px;
        margin-top: 16px;
        border: 0;
        border-radius: 10px;
        background: #536dfe;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        transition: background 150ms ease, transform 150ms ease;
      }

      .entry-card button:hover {
        background: #4058e8;
      }

      .entry-card button:active {
        transform: translateY(1px);
      }

      .entry-card button:focus-visible {
        outline: 3px solid rgb(83 109 254 / 35%);
        outline-offset: 3px;
      }

      .board {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #fff;
        cursor: crosshair;
        touch-action: none;
      }

      .board[hidden],
      .entry-screen[hidden] {
        display: none;
      }

      .board canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      @media (max-width: 480px) {
        .entry-card {
          padding: 30px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="entry-screen" id="entry-screen" aria-labelledby="title">
        <form class="entry-card" id="name-form">
          <h1 id="title">Benvingut a la pissarra</h1>
          <p>Escriu el teu nom per entrar i dibuixar movent el cursor.</p>
          <label for="user-name">El teu nom</label>
          <input
            id="user-name"
            name="name"
            type="text"
            maxlength="32"
            autocomplete="name"
            placeholder="Com et dius?"
            required
          />
          <button type="submit">Entrar</button>
        </form>
      </section>

      <section class="board" id="board" aria-label="Pissarra per dibuixar" hidden>
        <canvas id="drawing-canvas"></canvas>
      </section>
    </main>

    <script>
      const entryScreen = document.querySelector("#entry-screen");
      const nameForm = document.querySelector("#name-form");
      const nameInput = document.querySelector("#user-name");
      const board = document.querySelector("#board");
      const canvas = document.querySelector("#drawing-canvas");
      const context = canvas.getContext("2d");

      let previousPoint = null;

      function resizeCanvas() {
        const pixelRatio = window.devicePixelRatio || 1;
        const bounds = board.getBoundingClientRect();

        canvas.width = Math.round(bounds.width * pixelRatio);
        canvas.height = Math.round(bounds.height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        context.lineWidth = 4;
        context.lineCap = "round";
        context.lineJoin = "round";
        context.strokeStyle = "#26334d";
      }

      nameForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = nameInput.value.trim();
        if (!name) {
          nameInput.focus();
          return;
        }

        sessionStorage.setItem("canvas-user-name", name);
        entryScreen.hidden = true;
        board.hidden = false;
        resizeCanvas();
      });

      board.addEventListener("pointermove", (event) => {
        const bounds = canvas.getBoundingClientRect();
        const point = {
          x: event.clientX - bounds.left,
          y: event.clientY - bounds.top,
        };

        if (previousPoint) {
          context.beginPath();
          context.moveTo(previousPoint.x, previousPoint.y);
          context.lineTo(point.x, point.y);
          context.stroke();
        }

        previousPoint = point;
      });

      board.addEventListener("pointerleave", () => {
        previousPoint = null;
      });

      window.addEventListener("resize", () => {
        if (!board.hidden) {
          resizeCanvas();
        }
      });
    </script>
  </body>
</html>
