<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pissarra col·laborativa per dibuixar en temps real."
    />
    <title>Pissarra compartida</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/vue.global.prod.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main id="app">
      <div v-if="!inRoom" class="lobby">
        <form class="lobby-card" @submit.prevent="joinRoom()">
          <label for="username">El teu nom</label>
          <input
            id="username"
            v-model="username"
            type="text"
            maxlength="32"
            autocomplete="name"
            placeholder="Com et dius?"
            required
          />

          <label for="room-name">Nom de la sala</label>
          <input
            id="room-name"
            v-model="roomName"
            type="text"
            maxlength="40"
            placeholder="Per exemple, Prova"
            required
          />
          <button class="primary-button" type="submit" :disabled="!connected">
            {{ connected ? "Crear o unir-me a la sala" : "Connectant..." }}
          </button>

          <p v-if="error" class="error-message" role="alert">{{ error }}</p>
          <section class="room-directory" aria-labelledby="rooms-title">
            <div class="section-heading">
              <h2 id="rooms-title">Sales actives</h2>
              <span>{{ rooms.length }}</span>
            </div>
            <p v-if="rooms.length === 0" class="empty-state">
              Encara no hi ha cap sala oberta.
            </p>
            <ul v-else>
              <li v-for="room in rooms" :key="room.name">
                <button
                  class="room-link"
                  type="button"
                  :disabled="!connected"
                  @click="joinRoom(room.name)"
                >
                  <span class="room-avatar" aria-hidden="true">#</span>
                  <span class="room-link-name">{{ room.name }}</span>
                  <span class="room-count">
                    {{ room.users }} {{ room.users === 1 ? "persona" : "persones" }}
                  </span>
                  <span class="room-arrow" aria-hidden="true">↗</span>
                </button>
              </li>
            </ul>
          </section>
          <p class="connection-note" :data-state="connected ? 'connected' : 'offline'">
            <span class="status-dot" aria-hidden="true"></span>
            {{ connected ? "Connexió en directe" : "Connectant amb el servidor..." }}
          </p>
        </form>
      </div>
    </main>
  </body>
</html>
